<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with Gradient & Mesh Glow -->
  <rect width="1200" height="280" rx="24" fill="#0A0D14"/>
  <rect width="1200" height="280" rx="24" stroke="url(#border-grad)" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="140" r="160" fill="url(#purple-glow)" opacity="0.25"/>
  <circle cx="1000" cy="140" r="160" fill="url(#cyan-glow)" opacity="0.25"/>
  
  <!-- Subtle Grid Pattern overlay -->
  <g opacity="0.05">
    <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M200 0V280M400 0V280M600 0V280M800 0V280M1000 0V280" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Logo Icon -->
  <g transform="translate(180, 85)">
    <rect x="0" y="0" width="110" height="110" rx="28" fill="url(#icon-grad)"/>
    <path d="M32 80V30L55 62L78 30V80" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="55" cy="30" r="4" fill="#6366F1"/>
  </g>

  <!-- NOVAPAY Main Gradient Text -->
  <text x="320" y="155" fill="url(#text-grad)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="92" letter-spacing="4">NOVAPAY</text>
  
  <!-- Tagline -->
  <text x="325" y="195" fill="#A1A1AA" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" letter-spacing="3">DECENTRALIZED ZERO-KNOWLEDGE REMITTANCE PROTOCOL</text>
  
  <!-- Midnight Badge Accent -->
  <g transform="translate(930, 40)">
    <rect width="210" height="36" rx="18" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
    <circle cx="22" cy="18" r="6" fill="#10B981"/>
    <text x="36" y="23" fill="#E0E7FF" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" letter-spacing="1">MIDNIGHT PREVIEW</text>
  </g>

  <!-- Gradients Definition -->
  <defs>
    <linearGradient id="border-grad" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="320" y1="80" x2="900" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#C084FC"/>
      <stop offset="70%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="icon-grad" x1="0" y1="0" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <radialGradient id="purple-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(200 140) rotate(90) scale(160)">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1000 140) rotate(90) scale(160)">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>
