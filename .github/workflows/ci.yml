name: CI/CD Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # Job 1: Verify Midnight Compact Smart Contracts
  smart-contracts:
    name: Verify Midnight Compact Smart Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Escrow Compact Contract Artifacts
        run: |
          test -f contracts/escrow/managed/contract/index.js && echo "Escrow contract JS verified"

      - name: Verify Recurring Billing Compact Contract Artifacts
        run: |
          test -f contracts/recurring/managed/contract/index.js && echo "Recurring billing contract JS verified"

  # Job 2: Verify, Lint, and Test Web App (Next.js Frontend & Node Backend)
  web-app:
    name: Verify Web Application (Next.js & Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Frontend (Next.js)
        run: npm run build

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Configure Server Environment
        run: |
          cat << 'EOF' > server/.env
          NODE_ENV=test
          PORT=5000
          MIDNIGHT_NETWORK=preview
          MIDNIGHT_RPC_URL=https://rpc.preview.midnight.network
          MIDNIGHT_INDEXER_URL=https://indexer.preview.midnight.network/graphql
          MIDNIGHT_EXPLORER_URL=https://explorer.1am.xyz
          MIDNIGHT_ASSET_ID=tDUST
          DATABASE_URL="file:./dev.db"
          JWT_SECRET="novapay_test_jwt_secret_token_32chars_minimum!"
          JWT_REFRESH_SECRET="novapay_test_jwt_refresh_secret_32chars_minimum!"
          CORS_ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3001
          EOF

      - name: Build Server & Generate Prisma Client
        run: |
          cd server
          npm run build

      - name: Initialize Test Database
        run: |
          cd server
          npx prisma db push --skip-generate

      - name: Run Server Unit Tests
        run: |
          cd server
          npm test

  # Job 3: Continuous Deployment (CD) - Deploy to Vercel and Render on master merge
  deploy:
    name: Deploy to Production
    needs: [smart-contracts, web-app]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Frontend CD Check
      - name: Check Vercel Configuration
        id: vercel_check
        run: |
          if [ -z "${{ secrets.VERCEL_TOKEN }}" ]; then
            echo "::warning::VERCEL_TOKEN is not configured. Skipping Vercel deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Frontend to Vercel
        if: steps.vercel_check.outputs.configured == 'true'
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./

      # Backend CD Check
      - name: Check Render Configuration
        id: render_check
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured. Skipping Render deployment."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Deploy Backend to Render
        if: steps.render_check.outputs.configured == 'true'
        run: |
          curl -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
